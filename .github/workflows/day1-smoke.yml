name: Day 1 smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/inventory-service/requirements.txt

      - name: Start API
        working-directory: services/inventory-service
        run: |
          nohup uvicorn app.main:app --port 8001 > ../../api.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:8001/health && break; sleep 1; done

      - name: Check endpoints
        run: |
          curl -fsS -i localhost:8001/health
          curl -fsS localhost:8001/products | python3 -m json.tool

      - name: Show API log on failure
        if: failure()
        run: cat api.log