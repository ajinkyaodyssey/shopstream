services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - ./services/inventory-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inventory-data: